  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at 50% 20%, #1a2232 0%, #090c13 100%);
      color: #e2e8f0;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-cs {
      font-family: 'Teko', sans-serif;
      letter-spacing: 1.5px;
    }
    /* Kim chỉ tâm CS2 */
    .indicator-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      transform: translateX(-50%);
      background: #fbbf24;
      box-shadow: 0 0 14px 3px rgba(251, 191, 36, 0.9);
      z-index: 30;
      pointer-events: none;
    }
    .indicator-triangle-top {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-top: 16px solid #fbbf24;
      z-index: 31;
    }
    .indicator-triangle-bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 16px solid #fbbf24;
      z-index: 31;
    }
    .cs-rays {
      background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.025) 0deg 15deg, transparent 15deg 30deg);
    }
    .case-tab.active {
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.25) 0%, rgba(245, 158, 11, 0.05) 100%);
      border-color: #f59e0b;
      color: #fbbf24;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.35);

            image: 'https://images.unsplash.com/photo-1519567241046-7f570eee3ce6?auto=format&fit=crop&w=600&q=80',
            desc: 'Điều hòa mát rượi, dạo quanh mua sắm, check-in sống ảo và ngắm phố xá lung linh.'
          },
          {
            name: 'Board Game Cafe',
            tier: 'Classified',
            tierName: 'Classified (Hồng)',
            color: '#d32ce6',
            image: 'https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?auto=format&fit=crop&w=600&q=80',
            desc: 'Đấu trí căng thẳng, lừa lọc nhau cười nghiêng ngả với Ma Sói, Uno, Mèo Nổ cùng ly trà mát.'
          },
          {
            name: 'Lượn Vi Vu',
            tier: 'Restricted',
            tierName: 'Restricted (Tím)',
            color: '#8847ff',
            image: 'https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=600&q=80',
            desc: 'Xách xe lượn phố hóng gió đêm mát rượi, ngắm cảnh phố phường không lo kẹt xe.'
          },
          {
            name: 'Tô Tượng',
            tier: 'Mil-spec',
            tierName: 'Mil-Spec (Xanh)',
            color: '#4b69ff',
            image: 'https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=600&q=80',
            desc: 'Rèn luyện tính kiên nhẫn, trổ tài họa sĩ pha màu và xả stress cực hiệu quả.'
          }
        ]
      }
    };

    // 2. Bộ âm thanh CS2 độc lập bằng Web Audio API
    class CS2AudioEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTick() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(130, this.ctx.currentTime + 0.035);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.035);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.035);
        } catch(e) {}
      }
      playWin() {
        if (!this.ctx) return;
        try {
          const notes = [261.63, 329.63, 392.00, 523.25];
          notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = this.ctx.currentTime + (i * 0.1);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.14, start);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.55);
          });
        } catch(e) {}
      }
    }

    const sound = new CS2AudioEngine();

    // 3. Quản lý trạng thái
    let currentCategory = 'food';
    let isSpinning = false;
    let animFrameId = null;

    const CARD_WIDTH = 175;
    const CARD_MARGIN = 6;
    const TOTAL_CARD_WIDTH = CARD_WIDTH + (CARD_MARGIN * 2);
    const STRIP_COUNT = 65;
    const TARGET_INDEX = 53;

    const caseBadge = document.getElementById('case-badge');
    const caseTitle = document.getElementById('case-title');
    const caseTagline = document.getElementById('case-tagline');
    const caseCount = document.getElementById('case-count');
    const previewContainer = document.getElementById('case-preview');
    const track = document.getElementById('spinner-track');
    const container = document.getElementById('spinner-container');
    const spinBtn = document.getElementById('spin-btn');
    const statusHint = document.getElementById('status-hint');
    const tabButtons = document.querySelectorAll('.case-tab');

    // 4. Render danh sách Preview
    function renderPreview() {
      const items = CASE_DATA[currentCategory].items;
      previewContainer.innerHTML = '';
      caseCount.textContent = `${items.length} Lựa chọn`;

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = "bg-slate-900/90 border border-slate-700/60 rounded-lg overflow-hidden flex flex-col items-center p-1.5 text-center shadow";
        el.innerHTML = `
          <div class="w-full h-14 rounded overflow-hidden mb-1 bg-black/40">
            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
          </div>
          <div class="text-[11px] font-bold text-gray-200 truncate w-full">${item.name}</div>
          <div class="w-full h-1 mt-1.5 rounded-full" style="background-color: ${item.color}"></div>
        `;
        previewContainer.appendChild(el);
      });
    }

    // 5. Sinh dải thẻ trên Roulette
    function buildStrip(winnerItem) {
      const items = CASE_DATA[currentCategory].items;
      track.innerHTML = '';

      for (let i = 0; i < STRIP_COUNT; i++) {
        let item = (i === TARGET_INDEX) ? winnerItem : items[Math.floor(Math.random() * items.length)];

        const card = document.createElement('div');
        card.className = "flex-shrink-0 bg-slate-900/95 border border-slate-700 rounded-xl overflow-hidden flex flex-col justify-between shadow-lg";
        card.style.width = `${CARD_WIDTH}px`;
        card.style.height = `215px`;
        card.style.margin = `0 ${CARD_MARGIN}px`;
        card.style.borderBottom = `5px solid ${item.color}`;

        card.innerHTML = `
          <div class="p-2 text-center">
            <span class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded text-white/90" style="background:${item.color}33; border: 1px solid ${item.color}88">
              ${item.tier}
            </span>
            <h4 class="font-cs text-2xl font-bold tracking-wide mt-1 truncate text-gray-100">${item.name}</h4>
          </div>
          <div class="w-full h-28 px-2 overflow-hidden flex items-center justify-center">
            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover rounded-lg shadow-inner">
          </div>
          <div class="w-full h-2" style="background-color: ${item.color}"></div>
        `;
        track.appendChild(card);
      }
    }

    // 6. Chuyển đổi Category
    function switchCategory(cat) {
      if (isSpinning || currentCategory === cat) return;
      currentCategory = cat;

      tabButtons.forEach(btn => {
        if (btn.dataset.case === cat) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const curData = CASE_DATA[currentCategory];
      caseBadge.textContent = curData.badge;
      caseTitle.textContent = curData.title;
      caseTagline.textContent = curData.tagline;

      renderPreview();
      track.style.transition = 'none';
      track.style.transform = `translateX(0px)`;
      buildStrip(curData.items[0]);
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => switchCategory(btn.dataset.case));
    });

    renderPreview();
    buildStrip(CASE_DATA[currentCategory].items[0]);

    // 7. Logic quay Roulette CS2
    function spinCase() {
      if (isSpinning) return;
      isSpinning = true;
      sound.init();

      spinBtn.disabled = true;
      spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
      tabButtons.forEach(b => b.classList.add('pointer-events-none', 'opacity-60'));
      statusHint.textContent = "Hòm đang quay... hãy xem vũ trụ chọn gì!";

      const items = CASE_DATA[currentCategory].items;
      const winner = items[Math.floor(Math.random() * items.length)];

      track.style.transition = 'none';
      track.style.transform = `translateX(0px)`;
      buildStrip(winner);

      void track.offsetWidth;

      const containerWidth = container.offsetWidth;
      const targetCardCenter = (TARGET_INDEX * TOTAL_CARD_WIDTH) + (TOTAL_CARD_WIDTH / 2);
      const randomOffset = (Math.random() - 0.5) * (CARD_WIDTH * 0.72);
      const finalTranslate = -(targetCardCenter - (containerWidth / 2) + randomOffset);

      const spinDuration = 5500;
      track.style.transition = `transform ${spinDuration}ms cubic-bezier(0.12, 0.82, 0.15, 1)`;
      track.style.transform = `translateX(${finalTranslate}px)`;

      let lastIndex = -1;
      const startTime = performance.now();

      function trackTicks() {
        const matrix = new WebKitCSSMatrix(window.getComputedStyle(track).transform);
        const currentX = Math.abs(matrix.m41);
        const currentCenter = currentX + (containerWidth / 2);
        const currentIndex = Math.floor(currentCenter / TOTAL_CARD_WIDTH);

        if (currentIndex !== lastIndex && currentIndex >= 0 && currentIndex < STRIP_COUNT) {
          lastIndex = currentIndex;
          sound.playTick();
        }

        if (performance.now() - startTime < spinDuration) {
          animFrameId = requestAnimationFrame(trackTicks);
        }
      }
      animFrameId = requestAnimationFrame(trackTicks);

      setTimeout(() => {
        cancelAnimationFrame(animFrameId);
        sound.playWin();
        openResultModal(winner);

        isSpinning = false;
        spinBtn.disabled = false;
        spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        tabButtons.forEach(b => b.classList.remove('pointer-events-none', 'opacity-60'));
        statusHint.textContent = "Nhấn nút hoặc bấm SPACE để mở tiếp";
      }, spinDuration + 350);
    }

    // 8. Modal Kết quả
    const modal = document.getElementById('result-modal');
    const modalBox = document.getElementById('modal-box');
    const modalDishName = document.getElementById('modal-dish-name');
    const modalDishImg = document.getElementById('modal-dish-img');
    const modalDishDesc = document.getElementById('modal-dish-desc');
    const modalRarityLabel = document.getElementById('modal-rarity-label');
    const modalRarityGlow = document.getElementById('modal-rarity-glow');
    const modalClaimBtn = document.getElementById('modal-claim-btn');
    const modalSpinAgain = document.getElementById('modal-spin-again');

    function openResultModal(item) {
      modalDishName.textContent = item.name;
      modalDishImg.src = item.image;
      modalDishDesc.textContent = `"${item.desc}"`;
      modalRarityLabel.textContent = item.tierName;
      modalRarityLabel.style.backgroundColor = item.color;
      modalRarityLabel.style.color = item.tier === 'Gold' ? '#000' : '#fff';

      modalBox.style.borderColor = item.color;
      modalBox.style.boxShadow = `0 0 50px -10px ${item.color}`;
      modalRarityGlow.style.backgroundColor = item.color;

      modal.classList.remove('opacity-0', 'pointer-events-none');
      modalBox.classList.remove('scale-90');
      modalBox.classList.add('scale-100');
    }

    function closeModal() {
      modal.classList.add('opacity-0', 'pointer-events-none');
      modalBox.classList.remove('scale-100');
      modalBox.classList.add('scale-90');
    }

    spinBtn.addEventListener('click', spinCase);
    modalClaimBtn.addEventListener('click', closeModal);
    modalSpinAgain.addEventListener('click', () => {
      closeModal();
      setTimeout(spinCase, 300);
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !isSpinning) {
        e.preventDefault();
        if (!modal.classList.contains('opacity-0')) {
          closeModal();
        } else {
          spinCase();
        }
      }
    });
  </script>
